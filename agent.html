<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#063B82">
  <title>AI Form Agent | Vellore Institute of Technology</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Source+Serif+4:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="top2">
    <div class="wrap">
      <b>VIT · AI Form Agent</b>
      <span><a href="index.html">Home</a> &nbsp;·&nbsp; <button id="logout" type="button">Logout</button></span>
    </div>
  </div>
  <main class="ag">
    <section class="card chat" aria-label="Form agent chat">
      <div class="ai-msgs" id="msgs" aria-live="polite"></div>
      <div class="chips" id="chips"></div>
      <form id="chatForm">
        <input id="input" aria-label="Your message" autocomplete="off" list="suggestions">
        <datalist id="suggestions"></datalist>
        <button class="btn btn-blue" type="submit">Send</button>
      </form>
    </section>
    <aside class="card side2" aria-label="Saved details">
      <h2>Saved in this browser</h2>
      <dl id="profile"></dl>
      <p>Details are stored only on this device (not encrypted). Avoid using this on shared computers.</p>
      <button class="btn btn-ghost" style="color: var(--navy); border-color: var(--navy)" id="clear" type="button">Delete my saved data</button>
    </aside>
  </main>
  <script type="module" src="agent.js"></script>
</body>
</html>
